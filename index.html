        const detectUserLocation = () => {
            try {
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const found = CITIES.find(c => c.timezone === tz);
                if (found) return found;

                const parts = tz.split('/');
                const city = parts[parts.length - 1]?.replace(/_/g, ' ') || 'Unknown City';
                const country = parts[0] || 'Unknown Region';
                return {
                    id: tz.toLowerCase().replace(/\//g, '_'),
                    city: city,
                    country: country,
                    timezone: tz,
                    flag: '📍',
                    region: 'Local'
                };
            } catch (error) {
                return CITIES.find(c => c.id === 'gb_lon');
            }
        };

        const safeFormat = (date, options) => {
            try {
                return new Intl.DateTimeFormat('en-US', options).format(date);
            } catch (e) {
                return '';
            }
        };

        const getLocalHour = (date, timezone) => {
            try {
                const hourStr = safeFormat(date, { hour: 'numeric', hour12: false, timeZone: timezone });
                return parseInt(hourStr, 10);
            } catch {
                return 12;
            }
        };

        const getRelativeDay = (date, primaryTz, targetTz) => {
            try {
                const primaryDateStr = new Intl.DateTimeFormat('en-CA', { timeZone: primaryTz }).format(date);
                const targetDateStr = new Intl.DateTimeFormat('en-CA', { timeZone: targetTz }).format(date);
                if (primaryDateStr === targetDateStr) return 'Today';
                if (targetDateStr > primaryDateStr) return 'Tomorrow';
                return 'Yesterday';
            } catch { return ''; }
        };

        const CompactCountryCard = ({ location, currentTime, myLocation }) => {
            // Updated to show seconds! 02:36:37 PM
            const timeOpts = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true, timeZone: location.timezone };
            const timeString = safeFormat(currentTime, timeOpts);
            
            const dateOpts = { weekday: 'short', month: 'short', day: 'numeric', timeZone: location.timezone };
            const dateString = safeFormat(currentTime, dateOpts);
            
            const relativeDay = getRelativeDay(currentTime, myLocation.timezone, location.timezone);
            const localHour = getLocalHour(currentTime, location.timezone);
            
            const isNight = localHour >= 19 || localHour < 6;
            const isMorning = localHour >= 6 && localHour < 12;
            
            let statusIcon = <IconSun className="w-3 h-3" />;
            let statusText = 'Day';
            let statusColor = 'text-amber-500 bg-amber-500/10 border-amber-500/20';

            if (isNight) {
                statusIcon = <IconMoon className="w-3 h-3" />;
                statusText = 'Night';
                statusColor = 'text-indigo-400 bg-indigo-500/10 border-indigo-500/20';
            } else if (isMorning) {
                statusIcon = <IconSun className="w-3 h-3" />;
                statusText = 'Morning';
                statusColor = 'text-orange-400 bg-orange-500/10 border-orange-500/20';
            }

            return (
                <div className="bg-slate-900 border border-slate-800 hover:bg-slate-800 hover:border-slate-600 rounded-xl p-4 flex flex-col justify-between gap-3 transition-all cursor-default shadow-sm hover:shadow-md h-full">
                    
                    <div className="flex items-start justify-between gap-2">
                        <div className="flex items-center gap-3">
                            <div className="text-2xl filter drop-shadow-sm flex-shrink-0">{location.flag}</div>
                            <div className="min-w-0">
                                <div className="text-sm font-bold text-white truncate">{location.country}</div>
                                <div className="text-[11px] text-slate-400 truncate">{location.city}</div>
                            </div>
                        </div>
                        <div className={`px-2 py-1 rounded-md text-[10px] font-medium flex items-center gap-1 border ${statusColor}`}>
                            {statusIcon} {statusText}
                        </div>
                    </div>

                    <div className="mt-2">
                        <div className="text-2xl font-bold text-cyan-400 font-mono tracking-tight tabular-nums">
                            {timeString}
                        </div>
                        <div className="flex justify-between items-end mt-1">
                            <div className="text-xs text-slate-500">{dateString}</div>
                            <div className="text-[10px] font-medium bg-slate-950 px-2 py-0.5 rounded text-slate-400 border border-slate-800">
                                {relativeDay}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const TopNav = () => (
            <nav className="sticky top-0 z-50 flex items-center justify-between px-6 py-4 bg-[#020817]/90 backdrop-blur-md border-b border-slate-800">
                <div className="flex items-center gap-3 cursor-pointer">
                    <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
                        <IconGlobe className="w-6 h-6 text-white" />

                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                    <span className="text-xs text-slate-400 font-medium hidden sm:block">Live Sync Active</span>
                </div>
            </nav>
        );

        const LocalHero = ({ location, currentTime }) => {
            const timeOpts = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true, timeZone: location.timezone };
            const timeString = safeFormat(currentTime, timeOpts);
            
            const dateOpts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: location.timezone };
            const dateString = safeFormat(currentTime, dateOpts);
            
            const tzOpts = { timeZoneName: 'shortOffset', timeZone: location.timezone };
            const offsetString = safeFormat(currentTime, tzOpts).split(' ').pop().replace('GMT', 'UTC');
            
            const tzNameOpts = { timeZoneName: 'short', timeZone: location.timezone };
            const tzAbbrParts = safeFormat(currentTime, tzNameOpts).split(' ');
            const tzAbbr = tzAbbrParts.length > 1 ? tzAbbrParts.pop() : offsetString;
            
            const localHour = getLocalHour(currentTime, location.timezone);
            
            let statusText = 'Day';
            let StatusIcon = IconSun;
            if (localHour >= 5 && localHour < 12) { statusText = 'Morning'; StatusIcon = IconSun; }
            else if (localHour >= 12 && localHour < 17) { statusText = 'Afternoon'; StatusIcon = IconSun; }
            else if (localHour >= 17 && localHour < 21) { statusText = 'Evening'; StatusIcon = IconMoon; }
            else { statusText = 'Night'; StatusIcon = IconMoon; }

            return (
                <div className="relative rounded-2xl overflow-hidden bg-gradient-to-br from-slate-900 to-slate-950 border border-slate-800 mb-8 shadow-2xl shadow-black/50">
                    <div className="absolute inset-0 z-0 opacity-10 pointer-events-none" 
                         style={{ backgroundImage: 'radial-gradient(circle at 80% 50%, rgba(6, 182, 212, 0.4) 0%, transparent 40%), radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.2) 0%, transparent 40%)' }}>
                    </div>
                    <div className="absolute right-0 top-0 bottom-0 w-2/3 opacity-20 bg-[radial-gradient(#3b82f6_1px,transparent_1px)] [background-size:24px_24px] [mask-image:linear-gradient(to_left,white,transparent)]"></div>
                    
                    <div className="relative z-10 p-8 lg:p-12 flex flex-col md:flex-row justify-between items-center gap-8">

                                <IconMapPin className="w-3.5 h-3.5" /> Your Local Time

                            <div className="flex items-center gap-6 w-full">

                                    <h2 className="text-4xl lg:text-5xl font-bold text-white tracking-tight drop-shadow-md">{location.country}</h2>
                                    <p className="text-xl text-slate-400 font-medium mt-2">{location.city} <span className="text-slate-600">•</span> <span className="text-sm">{location.timezone}</span></p>
                                </div>
                            </div>
                        </div>

                        <div className="flex flex-col items-center md:items-end flex-1 w-full text-center md:text-right">
                            <div className="text-6xl sm:text-7xl lg:text-8xl font-bold text-white tabular-nums tracking-tighter font-mono drop-shadow-[0_0_15px_rgba(255,255,255,0.1)]">
                                {timeString.replace(/(AM|PM)/i, '').trim()}
                                <span className="text-2xl lg:text-4xl font-semibold text-slate-400 ml-2 tracking-normal">
                                    {timeString.includes('AM') ? 'AM' : 'PM'}
                                </span>
                            </div>
                            <div className="text-lg lg:text-xl text-slate-300 font-medium mt-3">{dateString}</div>
                            
                            <div className="flex flex-wrap items-center justify-center md:justify-end gap-3 mt-6">
                                <span className="bg-slate-800/80 backdrop-blur text-slate-200 px-4 py-2 rounded-lg text-sm font-semibold border border-slate-700 shadow-inner">{tzAbbr}</span>
                                <span className="bg-slate-800/80 backdrop-blur text-slate-200 px-4 py-2 rounded-lg text-sm font-semibold border border-slate-700 shadow-inner">{offsetString}</span>
                                <span className="bg-gradient-to-r from-amber-500/20 to-orange-500/20 text-amber-400 px-4 py-2 rounded-lg text-sm font-semibold border border-amber-500/30 flex items-center gap-2 shadow-inner">
                                    <StatusIcon className="w-4 h-4" /> {statusText}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentTime, setCurrentTime] = useState(new Date());
            const [globalSearch, setGlobalSearch] = useState('');
            const myLocation = useMemo(() => detectUserLocation(), []);

            // The ticking heart of the app: updates exactly every 1 second
            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            // Filter logic for the massive grid
            const filteredGlobalCities = useMemo(() => {
                if (!globalSearch.trim()) return CITIES;
                const lower = globalSearch.toLowerCase();
                return CITIES.filter(c => 
                    c.country.toLowerCase().includes(lower) || 
                    c.city.toLowerCase().includes(lower) ||
                    c.timezone.toLowerCase().includes(lower)
                );
            }, [globalSearch]);

            return (
                <div className="min-h-screen bg-[#020817] text-slate-300 font-sans selection:bg-cyan-500/30 flex flex-col">
                    <TopNav />
                    
                    <main className="flex-1 max-w-[1600px] w-full mx-auto p-4 sm:p-6 lg:p-8 pt-6">
                        {/* Auto-detected user location hero block */}
                        <LocalHero location={myLocation} currentTime={currentTime} />
                        
                        {/* Massive Real-Time Global Grid */}
                        <div className="mt-12 animate-in fade-in duration-500">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4 bg-slate-900/40 p-6 rounded-2xl border border-slate-800/60 backdrop-blur-sm">
                                <div>
                                    <h2 className="text-2xl font-bold text-white flex items-center gap-3">
                                        <IconGlobe className="w-6 h-6 text-blue-500" /> All Countries Live Time
                                    </h2>
                                    <p className="text-sm text-slate-400 mt-1">Real-time clock for {CITIES.length} major cities and countries.</p>
                                </div>
                                <div className="relative w-full md:w-96 shadow-inner">
                                    <IconSearch className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" />
                                    <input 
                                        type="text" 
                                        placeholder="Search any country or city..." 
                                        value={globalSearch}
                                        onChange={(e) => setGlobalSearch(e.target.value)}
                                        className="w-full bg-slate-950 border border-slate-700 rounded-xl py-3 pl-10 pr-10 text-sm text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all placeholder:text-slate-600 shadow-inner"
                                    />
                                    {globalSearch && (
                                        <button 
                                            onClick={() => setGlobalSearch('')}
                                            className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300"
                                        >
                                            <IconX className="w-4 h-4" />
                                        </button>
                                    )}
                                </div>
                            </div>
                            
                            {filteredGlobalCities.length > 0 ? (
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4 pb-12">
                                    {filteredGlobalCities.map(city => (
                                        <CompactCountryCard 
                                            key={city.id} 
                                            location={city} 
                                            currentTime={currentTime}
                                            myLocation={myLocation}
                                        />
                                    ))}
                                </div>
                            ) : (
                                <div className="text-center py-20 text-slate-500 bg-slate-900/20 rounded-2xl border border-slate-800 border-dashed">
                                    <IconGlobe className="w-12 h-12 mx-auto mb-4 opacity-20" />
                                    No locations found matching "{globalSearch}". Try another search term.
                                </div>
                            )}
                        </div>
                    </main>

                    {/* Simple Footer */}
                    <footer className="border-t border-slate-800 bg-[#020817] py-6 px-8">
                        <div className="max-w-[1600px] mx-auto text-center text-xs text-slate-500">
                            WorldClock Live © {new Date().getFullYear()} • Accurate time zone processing via native Intl API.
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

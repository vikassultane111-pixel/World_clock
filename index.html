        .glass {

        .card-3d:hover {
            transform: translateY(-8px) scale(1.03) perspective(1000px) rotateX(2deg) rotateY(-2deg);

                <div id="time-difference" className="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-12 mb-20">
                    {/* Time Difference Calculator */}
                    <div className="glass-card rounded-2xl p-6 border border-slate-700/50">
                        <div className="flex items-center gap-3 mb-6">
                            <div className="p-2 bg-blue-500/20 rounded-lg"><IconClock className="w-5 h-5 text-blue-400"/></div>
                            <h2 className="text-xl font-bold text-white">Time Difference Calculator</h2>
                        </div>
                        
                        <div className="flex flex-col sm:flex-row items-center gap-4 mb-8">
                            <div className="flex-1 w-full bg-navy-950 border border-slate-800 rounded-xl p-3">
                                <div className="text-[10px] text-slate-500 uppercase font-bold mb-1">From Location</div>
                                <div className="text-sm text-white font-medium flex items-center gap-2"><IconMapPin className="w-4 h-4 text-cyan-400"/> {myLocation.country} - {myLocation.city}</div>
                            </div>
                            <IconArrowLeftRight className="w-6 h-6 text-slate-600 shrink-0" />
                            <div className="flex-1 w-full bg-navy-950 border border-slate-800 rounded-xl p-3 relative">
                                <div className="text-[10px] text-slate-500 uppercase font-bold mb-1">To Location</div>
                                <select 
                                    value={selectedCityId} 
                                    onChange={e => setSelectedCityId(e.target.value)}
                                    className="w-full bg-transparent text-sm text-white font-medium focus:outline-none appearance-none cursor-pointer"
                                >
                                    {CITIES.map(c => <option key={c.id} value={c.id} className="bg-navy-900">{c.country} - {c.city}</option>)}
                                </select>
                            </div>
                        </div>

                        <div className="flex justify-between items-center bg-navy-900/50 rounded-xl p-6 border border-slate-800/50">
                            <div className="text-center">
                                <div className="text-xs text-slate-400 mb-1">{myLocation.city}</div>
                                <div className="text-2xl font-bold text-white">{myTime}</div>
                            </div>
                            <div className="text-center px-4">
                                <div className={`text-lg font-bold ${diff.isAhead ? 'text-emerald-400' : 'text-rose-400'}`}>{diff.text}</div>
                                <div className="text-xs text-slate-500">of {myLocation.city}</div>
                            </div>
                            <div className="text-center">
                                <div className="text-xs text-slate-400 mb-1">{targetCity.city}</div>
                                <div className="text-2xl font-bold text-white">{theirTime}</div>
                            </div>
                        </div>
                    </div>

                    {/* Meeting Time Planner (Simplified visual version) */}
                    <div className="glass-card rounded-2xl p-6 border border-slate-700/50">
                        <div className="flex items-center justify-between mb-6">
                            <div className="flex items-center gap-3">
                                <div className="p-2 bg-emerald-500/20 rounded-lg"><IconCalendar className="w-5 h-5 text-emerald-400"/></div>
                                <h2 className="text-xl font-bold text-white">Meeting Time Planner</h2>
                            </div>
                        </div>
                        
                        <p className="text-sm text-slate-400 mb-6">Finding overlap between <strong className="text-white">{myLocation.city}</strong> (9 AM - 6 PM) and <strong className="text-white">{targetCity.city}</strong>.</p>

                        <div className="space-y-3">
                            <div className="bg-navy-950/80 border border-emerald-500/30 rounded-xl p-4 flex items-center justify-between">
                                <div>
                                    <div className="text-sm font-bold text-white">01:30 PM - 02:30 PM</div>
                                    <div className="text-xs text-slate-500">{myLocation.city}</div>
                                </div>
                                <div className="px-3 py-1 bg-emerald-500/20 text-emerald-400 text-[10px] font-bold rounded uppercase border border-emerald-500/30">Good Slot</div>
                            </div>
                            <div className="bg-navy-950/80 border border-blue-500/30 rounded-xl p-4 flex items-center justify-between opacity-70">
                                <div>
                                    <div className="text-sm font-bold text-white">08:00 AM - 09:00 AM</div>
                                    <div className="text-xs text-slate-500">{targetCity.city}</div>
                                </div>
                                <div className="px-3 py-1 bg-blue-500/20 text-blue-400 text-[10px] font-bold rounded uppercase border border-blue-500/30">Early</div>
                            </div>
                            <div className="w-full text-center mt-4">
                                <button className="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold py-2 px-6 rounded-lg transition-colors w-full sm:w-auto">
                                    Find All Slots
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentTime, setCurrentTime] = useState(new Date());
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedRegion, setSelectedRegion] = useState('All');
            const [selectedTimeOfDay, setSelectedTimeOfDay] = useState('All Time');
            
            const myLocation = useMemo(() => detectUserLocation(), []);

            // Master clock tick (updates every second)
            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            // Filtering logic
            const filteredCities = useMemo(() => {
                return CITIES.filter(city => {
                    // Search
                    const matchesSearch = city.country.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          city.city.toLowerCase().includes(searchQuery.toLowerCase());
                    // Region
                    const matchesRegion = selectedRegion === 'All' || city.region === selectedRegion;
                    
                    // Time of Day Filter
                    let matchesTime = true;
                    if (selectedTimeOfDay !== 'All Time') {
                        const localHour = getLocalHour(currentTime, city.timezone);
                        const status = getTimeOfDayStatus(localHour);
                        matchesTime = status.text === selectedTimeOfDay;
                    }

                    return matchesSearch && matchesRegion && matchesTime;
                });
            }, [searchQuery, selectedRegion, selectedTimeOfDay, currentTime]);

            return (
                <div className="min-h-screen flex flex-col selection:bg-cyan-500/30">
                    <TopNav />
                    
                    <main className="flex-1 max-w-[1600px] w-full mx-auto px-4 sm:px-6 py-8">
                        <HeroSection location={myLocation} currentTime={currentTime} />

                        <div id="world-clock" className="scroll-mt-24">
                            {/* Stats & Filters Bar */}
                            <div className="glass rounded-2xl p-6 mb-8 border border-slate-700/50">
                                <div className="flex flex-col lg:flex-row justify-between gap-6 mb-6">
                                    <div>
                                        <h2 className="text-2xl font-bold text-white flex items-center gap-2">
                                            <IconGlobe className="w-6 h-6 text-blue-500" /> All Countries Live Time
                                        </h2>
                                        <p className="text-sm text-slate-400 mt-1">Real-time clock for {CITIES.length} major cities across the globe.</p>
                                    </div>
                                    <div className="flex items-center gap-4 text-sm font-medium text-slate-300">
                                        <div className="flex items-center gap-2 bg-navy-950 px-4 py-2 rounded-lg border border-slate-800"><span className="text-red-500 text-lg">🚩</span> {CITIES.length} Locations</div>
                                        <div className="hidden sm:flex items-center gap-2 bg-navy-950 px-4 py-2 rounded-lg border border-slate-800"><IconMap className="w-4 h-4 text-cyan-400"/> {REGIONS.length - 1} Regions</div>
                                    </div>
                                </div>

                                <div className="flex flex-col xl:flex-row gap-4">
                                    <div className="relative w-full xl:w-80 shrink-0">
                                        <IconSearch className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" />
                                        <input 
                                            type="text" 
                                            placeholder="Filter by country or city..." 
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="w-full bg-navy-950 border border-slate-700 rounded-xl py-2.5 pl-9 pr-4 text-sm text-white focus:outline-none focus:border-cyan-500 transition-colors"
                                        />
                                    </div>
                                    
                                    <div className="flex-1 overflow-x-auto no-scrollbar pb-2 xl:pb-0">
                                        <div className="flex gap-2 min-w-max">
                                            {REGIONS.map(region => (
                                                <button 
                                                    key={region}
                                                    onClick={() => setSelectedRegion(region)}
                                                    className={`px-4 py-2 rounded-lg text-xs font-semibold transition-colors border ${
                                                        selectedRegion === region 
                                                        ? 'bg-blue-600 text-white border-blue-500' 
                                                        : 'bg-navy-950 text-slate-400 border-slate-800 hover:text-white hover:border-slate-600'
                                                    }`}
                                                >
                                                    {region}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="mt-4 pt-4 border-t border-slate-800 flex overflow-x-auto no-scrollbar gap-2">
                                    {TIME_FILTERS.map(time => (
                                        <button 
                                            key={time}
                                            onClick={() => setSelectedTimeOfDay(time)}
                                            className={`px-3 py-1.5 rounded-full text-xs font-semibold transition-colors border flex items-center gap-1.5 ${
                                                selectedTimeOfDay === time 
                                                ? 'bg-slate-700 text-white border-slate-500' 
                                                : 'bg-transparent text-slate-500 border-slate-800 hover:text-slate-300'
                                            }`}
                                        >
                                            {time}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Clock Grid */}
                            {filteredCities.length > 0 ? (
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-5">
                                    {/* Always show user location first if no filters are applied */}
                                    {searchQuery === '' && selectedRegion === 'All' && selectedTimeOfDay === 'All Time' && (
                                        <ClockCard city={myLocation} currentTime={currentTime} myLocation={myLocation} />
                                    )}
                                    
                                    {filteredCities
                                        .filter(c => c.id !== myLocation.id) // Prevent duplicate
                                        .map(city => (
                                        <ClockCard 
                                            key={city.id} 
                                            city={city} 
                                            currentTime={currentTime} 
                                            myLocation={myLocation} 
                                        />
                                    ))}
                                </div>
                            ) : (
                                <div className="text-center py-24 glass-card rounded-2xl border-dashed">
                                    <IconGlobe className="w-12 h-12 text-slate-600 mx-auto mb-4" />
                                    <h3 className="text-lg font-bold text-white mb-1">No locations found</h3>
                                    <p className="text-sm text-slate-400">Try adjusting your search or filters.</p>
                                </div>
                            )}
                        </div>

                        <ToolsSection myLocation={myLocation} currentTime={currentTime} />
                    </main>

                    {/* Simple Premium Footer */}
                    <footer className="mt-auto border-t border-white/5 bg-navy-950 py-8 px-6">
                        <div className="max-w-[1600px] mx-auto flex flex-col md:flex-row items-center justify-between gap-4 text-xs font-medium text-slate-500">
                            <div className="flex items-center gap-2">
                                <IconGlobe className="w-4 h-4 text-cyan-500" /> WorldClock Live © {new Date().getFullYear()}
                            </div>
                            <div className="flex gap-6">
                                <a href="#" className="hover:text-cyan-400 transition-colors">About</a>
                                <a href="#" className="hover:text-cyan-400 transition-colors">Privacy</a>
                                <a href="#" className="hover:text-cyan-400 transition-colors">Time Zone Info</a>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

        // Cache Formatters for extreme performance. 
        // Reinstantiating Intl.DateTimeFormat in renders kills performance for 100+ items.
        const formatterCache = new Map();
        const getFormatter = (timezone, options) => {
            const key = `${timezone}-${JSON.stringify(options)}`;
            if (!formatterCache.has(key)) {
                try {
                    formatterCache.set(key, new Intl.DateTimeFormat('en-US', { timeZone: timezone, ...options }));
                } catch (e) {
                    // Fallback to UTC if invalid TZ provided by browser/system
                    formatterCache.set(key, new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', ...options }));
                }
            }
            return formatterCache.get(key);
        };

        // Extract accurate UTC offset in hours from Intl API (handles +05:30, +05:45, -04:00 flawlessly)
        const getTzOffsetHours = (date, tz) => {
            try {
                const formatter = getFormatter(tz, { timeZoneName: 'shortOffset' });
                const parts = formatter.formatToParts(date);
                const tzName = parts.find(p => p.type === 'timeZoneName')?.value; 
                
                if (!tzName || tzName === 'GMT' || tzName === 'UTC') return 0;
                
                // Parse strings like "GMT+5", "GMT+05:30", "GMT-4"
                const match = tzName.match(/GMT([+-])(\d{1,2}):?(\d{2})?/);
                if (!match) return 0;
                
                const sign = match[1] === '-' ? -1 : 1;
                const hours = parseInt(match[2], 10);
                const mins = match[3] ? parseInt(match[3], 10) : 0;
                
                return sign * (hours + (mins / 60));
            } catch (error) {
                return 0; // Safe fallback
            }
        };

        // Robust time difference algorithm comparing exact UTC offsets.
        const getTimeDifference = (date, baseTz, targetTz) => {
            const baseOffset = getTzOffsetHours(date, baseTz);
            const targetOffset = getTzOffsetHours(date, targetTz);
            const diffHours = targetOffset - baseOffset;
            
            if (diffHours === 0) return { text: 'Same time', value: 0, dayOffset: 'Today' };

            const absHours = Math.floor(Math.abs(diffHours));
            const absMins = Math.round((Math.abs(diffHours) % 1) * 60);
            
            let timeStr = `${absHours}h`;
            if (absMins > 0) timeStr += ` ${absMins}m`;
            
            // Calculate Day relationship safely using Date parts, NOT parsing strings
            const getDayValue = (tz) => parseInt(getFormatter(tz, { day: 'numeric' }).format(date), 10);
            const baseDay = getDayValue(baseTz);
            const targetDay = getDayValue(targetTz);
            
            let dayStr = 'Today';
            if (targetDay !== baseDay) {
                // Handle month boundaries implicitly based on math sign
                dayStr = diffHours > 0 ? 'Tomorrow' : 'Yesterday'; 
            }

            return { 
                text: `${timeStr} ${diffHours > 0 ? 'ahead' : 'behind'}`,
                value: diffHours,
                isAhead: diffHours > 0,
                dayOffset: dayStr
            };
        };

        const getLocalHour = (date, timezone) => {
            try { return parseInt(getFormatter(timezone, { hour: 'numeric', hour12: false }).format(date), 10); }

            if (localHour >= 5 && localHour < 12) return { text: 'Morning', icon: <Icons.Sunrise c="w-4 h-4"/>, color: 'text-amber-400', border: 'border-amber-500/30', bg: 'bg-amber-500/10' };
            if (localHour >= 12 && localHour < 17) return { text: 'Afternoon', icon: <Icons.Sun c="w-4 h-4"/>, color: 'text-yellow-400', border: 'border-yellow-500/30', bg: 'bg-yellow-500/10' };
            if (localHour >= 17 && localHour < 21) return { text: 'Evening', icon: <Icons.Sunset c="w-4 h-4"/>, color: 'text-orange-400', border: 'border-orange-500/30', bg: 'bg-orange-500/10' };
            return { text: 'Night', icon: <Icons.Moon c="w-4 h-4"/>, color: 'text-indigo-400', border: 'border-indigo-500/30', bg: 'bg-indigo-500/10' };

                if (browserTz === 'Asia/Saigon') browserTz = 'Asia/Ho_Chi_Minh';
                
                const matchedLocation = GLOBAL_LOCATIONS.find(c => c.timezone === browserTz);
                if (matchedLocation) return matchedLocation;

                // Safe fallback: Construct location from raw TZ string
                const parts = browserTz.split('/');
                const cityStr = parts[parts.length - 1]?.replace(/_/g, ' ') || 'Local Time';
                return { 
                    id: browserTz, city: cityStr, country: parts[0] || 'Unknown', 
                    timezone: browserTz, flag: '📍', region: 'Local'

                                {sleeping ? <Icons.Moon c="w-3.5 h-3.5"/> : dayPart.icon}

        const MeetingPlanner = ({ locations, currentTime, is24Hour }) => {
            const [city1Id, setCity1Id] = useState(locations[0]?.id);
            const [city2Id, setCity2Id] = useState(locations.find(l => l.id === 'gb_lon')?.id || locations[1]?.id);
            
            const city1 = locations.find(c => c.id === city1Id);
            const city2 = locations.find(c => c.id === city2Id);

            // True algorithm for calculating overlapping work hours (9AM-6PM)
            const getMeetingSlots = () => {
                if (!city1 || !city2) return [];
                const slots = [];
                const currentLocalHour1 = getLocalHour(currentTime, city1.timezone);
                const offsetDiff = getTzOffsetHours(currentTime, city2.timezone) - getTzOffsetHours(currentTime, city1.timezone);
                
                // Scan the next 24 hours relative to City 1
                for (let i = 0; i < 24; i++) {
                    const h1 = (currentLocalHour1 + i) % 24;
                    // Handle fractional offsets mathematically
                    const h2Float = (currentLocalHour1 + i + offsetDiff + 24) % 24;
                    const h2 = Math.floor(h2Float);
                    const mins2 = Math.round((h2Float % 1) * 60);

                    // Standard Work Hours Check (9 to 18)
                    const isWork1 = h1 >= 9 && h1 < 18;
                    const isWork2 = h2 >= 9 && h2 < 18;
                    const isAwake1 = h1 >= 7 && h1 < 23;
                    const isAwake2 = h2 >= 7 && h2 < 23;

                    if (isAwake1 && isAwake2) {
                        let status = 'Acceptable'; let color = 'bg-blue-500/20 text-blue-400 border-blue-500/30';
                        if (isWork1 && isWork2) { status = 'Excellent'; color = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30'; }
                        else if (!isWork1 && !isWork2) { status = 'Poor'; color = 'bg-slate-800 text-slate-400 border-slate-700'; }

                        if (status !== 'Poor' || slots.length < 2) {
                            // Format cleanly
                            const timeFmt = (h, m=0) => {
                                if (is24Hour) return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
                                const ampm = h >= 12 ? 'PM' : 'AM';
                                const h12 = h % 12 || 12;
                                return `${h12}:${m.toString().padStart(2,'0')} ${ampm}`;
                            };

                            slots.push({
                                time1: timeFmt(h1),
                                time2: timeFmt(h2, mins2),
                                status, color,
                                sortScore: status === 'Excellent' ? 2 : status === 'Acceptable' ? 1 : 0
                            });
                        }
                    }
                }
                return slots.sort((a, b) => b.sortScore - a.sortScore).slice(0, 4); // Top 4
            };

            const slots = getMeetingSlots();
            const diff = city1 && city2 ? getTimeDifference(currentTime, city1.timezone, city2.timezone) : null;

                        {/* Clock Grid */}
                        {filteredLocations.length > 0 ? (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4">
                                {filteredLocations.map(location => (
                                    <ClockCard 
                                        key={`card-${location.id}`} 
                                        location={location} 
                                        currentTime={currentTime} 
                                        baseTimezone={myLocation.timezone} 
                                        is24Hour={is24Hour} 
                                    />
                                ))}
                            </div>
                        ) : (
                            <div className="text-center py-20 glass-panel rounded-2xl border-dashed">
                                <Icons.Search c="w-10 h-10 text-slate-600 mx-auto mb-3" />
                                <h3 className="text-lg font-bold text-white mb-1">No locations found</h3>
                                <p className="text-sm text-slate-400">Adjust your search or clear filters to see more results.</p>
                                <button onClick={() => {setGlobalSearch(''); setSelectedRegion('All'); setSelectedDayPart('All Time');}} className="mt-4 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded text-sm transition-colors">Clear All Filters</button>
                            </div>
                        )}

                        <MeetingPlanner locations={GLOBAL_LOCATIONS} currentTime={currentTime} is24Hour={is24Hour} />
                    </main>

                    <footer className="mt-auto border-t border-slate-800 bg-navy-950 py-8 px-6">
                        <div className="max-w-[1800px] mx-auto flex flex-col md:flex-row items-center justify-between gap-4 text-xs font-medium text-slate-500">
                            <div className="flex items-center gap-2">
                                <Icons.Globe c="w-4 h-4 text-brand-cyan" /> WorldClock Live © {new Date().getFullYear()} — Universal Read-Only Information Dashboard
                            </div>
                            <div className="flex gap-6">
                                <a href="#" className="hover:text-brand-cyan transition-colors">Data Attribution</a>
                                <a href="#" className="hover:text-brand-cyan transition-colors">Privacy</a>
                                <a href="#" className="hover:text-brand-cyan transition-colors">Time Zone Accuracy</a>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
